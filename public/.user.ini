; Настройки PHP для хостингов с PHP-FPM/CGI (читается автоматически, обновление до 5 минут).
; Если у вас mod_php, задайте то же в php.ini или .htaccess через php_value.
display_errors = Off
log_errors = On
register_argc_argv = Off
allow_url_include = Off
upload_max_filesize = 16M
post_max_size = 20M
max_file_uploads = 20
memory_limit = 256M
session.use_strict_mode = 1
session.cookie_httponly = 1
